# Configuração Fly.io — CaetanoFinanças API
# Deploy: fly deploy
# Criar volume (1x apenas): fly volumes create data --region gru --size 1

app = "caetano-financas-api"
primary_region = "gru"  # São Paulo

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[mounts]]
  source = "data"
  destination = "/app/data"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
